<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864">
  <defs>
    <linearGradient id="scandi-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9F6F2"/>
      <stop offset="100%" stop-color="#F0ECE6"/>
    </linearGradient>
  </defs>
  <rect width="1536" height="864" fill="url(#scandi-bg)"/>
  <!-- Hygge warm accent bar -->
  <rect x="0" y="0" width="6" height="864" fill="#D4A373"/>
  <!-- Subtle texture — irregular horizontal strokes -->
  <g stroke="rgba(180,150,120,0.12)" stroke-width="1" stroke-linecap="round">
    <line x1="60" y1="160" x2="480" y2="160"/>
    <line x1="60" y1="240" x2="360" y2="240"/>
    <line x1="60" y1="320" x2="420" y2="320"/>
    <line x1="60" y1="400" x2="320" y2="400"/>
    <line x1="60" y1="480" x2="400" y2="480"/>
    <line x1="60" y1="560" x2="340" y2="560"/>
    <line x1="60" y1="640" x2="460" y2="640"/>
    <line x1="60" y1="720" x2="380" y2="720"/>
  </g>
  <!-- Leaf/nature motif — simple arc -->
  <path d="M 1200,100 Q 1400,300 1200,500 Q 1000,300 1200,100 Z" fill="rgba(180,200,160,0.08)"/>
  <path d="M 1280,150 Q 1440,350 1280,540 Q 1120,350 1280,150 Z" fill="rgba(180,200,160,0.06)"/>
  <!-- Minimal cross motif -->
  <g stroke="rgba(180,150,120,0.2)" stroke-width="1.5">
    <line x1="1420" y1="700" x2="1500" y2="700"/>
    <line x1="1460" y1="660" x2="1460" y2="740"/>
  </g>
</svg>
