<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864">
  <defs>
    <filter id="chalk-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey-noise"/>
      <feBlend in="SourceGraphic" in2="grey-noise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <pattern id="chalk-lines" width="1536" height="48" patternUnits="userSpaceOnUse">
      <line x1="0" y1="47" x2="1536" y2="47" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1536" height="864" fill="#1A3A2A"/>
  <rect width="1536" height="864" fill="url(#chalk-lines)"/>
  <!-- Chalk smudge texture simulation via semi-transparent rects -->
  <rect x="0" y="0" width="1536" height="864" fill="rgba(200,220,200,0.03)" filter="url(#chalk-noise)"/>
  <!-- Chalk rail at bottom -->
  <rect x="0" y="824" width="1536" height="40" fill="#2A1A0A"/>
  <rect x="0" y="820" width="1536" height="4" fill="rgba(255,255,255,0.15)"/>
  <!-- Chalk dust marks -->
  <g opacity="0.15" fill="white">
    <ellipse cx="200" cy="828" rx="40" ry="6"/>
    <ellipse cx="600" cy="830" rx="25" ry="5"/>
    <ellipse cx="1100" cy="827" rx="55" ry="7"/>
    <ellipse cx="1400" cy="829" rx="30" ry="5"/>
  </g>
  <!-- Frame border -->
  <rect x="0" y="0" width="1536" height="8" fill="rgba(100,60,20,0.6)"/>
  <rect x="0" y="0" width="8" height="864" fill="rgba(100,60,20,0.6)"/>
  <rect x="1528" y="0" width="8" height="864" fill="rgba(100,60,20,0.6)"/>
</svg>
