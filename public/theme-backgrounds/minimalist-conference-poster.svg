<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864">
  <rect width="1536" height="864" fill="#FFFFFF"/>
  <!-- Single accent rule -->
  <rect x="80" y="96" width="240" height="4" fill="#2563EB"/>
  <!-- Subtle column grid -->
  <g stroke="rgba(0,0,0,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="864"/>
    <line x1="464" y1="0" x2="464" y2="864"/>
    <line x1="848" y1="0" x2="848" y2="864"/>
    <line x1="1232" y1="0" x2="1232" y2="864"/>
    <line x1="1456" y1="0" x2="1456" y2="864"/>
  </g>
  <!-- Baseline grid -->
  <g stroke="rgba(0,0,0,0.025)" stroke-width="1">
    <line x1="0" y1="160" x2="1536" y2="160"/>
    <line x1="0" y1="320" x2="1536" y2="320"/>
    <line x1="0" y1="480" x2="1536" y2="480"/>
    <line x1="0" y1="640" x2="1536" y2="640"/>
    <line x1="0" y1="800" x2="1536" y2="800"/>
  </g>
  <!-- Minimal accent dot -->
  <circle cx="80" cy="96" r="6" fill="#2563EB"/>
</svg>
